name: Network CI/CD Pipeline

on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ansible and Linter (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Run Ansible syntax check
        run: ansible-playbook -i inventory/production.yml playbooks/backup.yml --syntax-check

      - name: Run Ansible-lint
        run: ansible-lint playbooks/backup.yml

      - name: Check Ansible Playbook syntax
        run: |
          ansible-playbook -i inventory.yml backup.yml --syntax-check
